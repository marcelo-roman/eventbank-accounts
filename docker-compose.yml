name: eventbank-accounts

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: eventbank
      POSTGRES_PASSWORD: eventbank
      POSTGRES_DB: accounts
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventbank"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
